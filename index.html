<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/frontend/src/brand-icon.svg"><title>BSDT 内部研究工作台</title>
<style>html,body{margin:0;background:#e8edf5;color:#243349;font-family:"Microsoft YaHei",sans-serif}.boot-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.boot-screen img{width:52px;height:52px}.boot-screen h1{font-size:20px;letter-spacing:1px;margin:0}.boot-screen p{font-size:13px;color:#617086;margin:0}.boot-progress{width:100px;height:3px;background:#dbe4f1;border-radius:2px;overflow:hidden}.boot-progress:after{content:"";display:block;width:40%;height:100%;background:#315dcc;animation:boot-slide 1.3s ease-in-out infinite}.boot-screen button{background:#315dcc;border:1px solid #315dcc;border-radius:5px;color:#ffffff;padding:8px 18px;cursor:pointer}.boot-screen button[hidden]{display:none}@keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}@media(prefers-reduced-motion:reduce){.boot-progress:after{animation:none}}</style>
</head><body><div id="root"><div class="boot-screen" role="status"><img src="/frontend/src/brand-icon.svg" alt="BSDT"><h1>BSDT 研究工作台</h1><p id="boot-status">正在启动工作台…</p><div class="boot-progress" aria-hidden="true"></div><button id="boot-retry" hidden>重新加载</button></div></div>
<script>function bootProblem(message){var text=document.getElementById('boot-status');if(text){text.textContent=message;document.getElementById('boot-retry').hidden=false}}document.getElementById('boot-retry').addEventListener('click',function(){location.reload()});window.addEventListener('error',function(event){if(event instanceof ErrorEvent||event.target instanceof HTMLScriptElement)bootProblem('界面加载失败，请重新加载。')},true);setTimeout(function(){bootProblem('启动时间较长，请重新加载。')},10000);</script>
<script id="app-entry" type="module" src="/frontend/src/main.tsx" onerror="bootProblem('界面加载失败，请重新加载。')"></script></body></html>
